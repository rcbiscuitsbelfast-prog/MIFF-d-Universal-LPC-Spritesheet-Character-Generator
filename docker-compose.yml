version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./spritesheets:/app/spritesheets:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SPRITESHEETS_PATH=/app/spritesheets
      - PERSISTENT_DISK_PATH=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
