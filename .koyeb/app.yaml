# Koyeb Deployment Configuration for LPC Avatar Builder
# https://www.koyeb.com/docs/reference/yaml

app:
  name: lpc-avatar-builder
  
services:
  - name: web
    type: web
    
    # Git source
    git:
      branch: master
      buildCommand: npm install && npm run submodule:init
      runCommand: npm start
      
    # Instance configuration
    instance:
      type: nano  # Free tier: nano, or paid: small, medium, large
      
    # Ports
    ports:
      - port: 3000
        protocol: http
        
    # Environment variables
    env:
      - name: NODE_ENV
        value: production
      - name: PORT
        value: "3000"
      - name: SPRITESHEETS_PATH
        value: /app/spritesheets
      - name: PERSISTENT_DISK_PATH
        value: /app/data
      - name: MAX_FILE_SIZE
        value: "5242880"
        
    # Health check
    health_check:
      http:
        path: /health
        port: 3000
      grace_period: 60
      interval: 30
      timeout: 10
      restart_limit: 3
      
    # Persistent storage (Koyeb Volumes)
    volumes:
      - name: uploads
        path: /app/data
        size: 10  # GB
        
    # Auto-scaling
    scaling:
      min: 1
      max: 1  # Set higher for auto-scaling
      
    # Regions (choose closest to your users)
    regions:
      - fra  # Frankfurt (Europe)
      # - was  # Washington DC (US East)
      # - sin  # Singapore (Asia)
