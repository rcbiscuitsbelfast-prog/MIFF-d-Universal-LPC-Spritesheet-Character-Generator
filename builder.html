<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="Create and customize LPC-style game characters with live animation preview">
  <title>LPC Character Builder v6</title>
  <link rel="stylesheet" href="builder.css">
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <div>
      <div class="spinner"></div>
      <p>Loading character builder...</p>
    </div>
  </div>

  <!-- Main app container -->
  <div id="app" class="hidden">
    <!-- Top navigation bar -->
    <header class="top-nav">
      <h1>?? LPC Builder <span style="font-size: 0.6em; opacity: 0.8;">v6</span></h1>
      <div class="nav-actions">
        <button class="nav-btn" id="btn-back" aria-label="Back" style="display: none;">
          <span class="icon">?</span>
          <span class="label">Back</span>
        </button>
        <button class="nav-btn" id="btn-export" aria-label="Export character">
          <span class="icon">??</span>
          <span class="label">Export</span>
        </button>
        <button class="nav-btn" id="btn-help" aria-label="Help">
          <span class="icon">?</span>
          <span class="label">Help</span>
        </button>
      </div>
    </header>

    <!-- Main content area -->
    <main class="main-content">
      <!-- Character preview canvas -->
      <div class="preview-container">
        <canvas id="character-canvas" width="192" height="192"></canvas>
        <div class="preview-info">
          <span id="current-animation">Walk</span>
          <span id="current-direction">Down</span>
        </div>
        
        <!-- Direction arrows -->
        <div class="direction-controls">
          <button class="dir-arrow" data-direction="up" aria-label="Face Up">?</button>
          <div class="dir-row">
            <button class="dir-arrow" data-direction="left" aria-label="Face Left">?</button>
            <button class="dir-arrow active" data-direction="down" aria-label="Face Down">?</button>
            <button class="dir-arrow" data-direction="right" aria-label="Face Right">?</button>
          </div>
        </div>

        <!-- Category Navigation (horizontal with arrows) -->
        <div class="category-nav" id="category-nav" style="display: none;">
          <button class="nav-arrow" id="prev-category" aria-label="Previous">?</button>
          <div class="category-label" id="current-category-label">Body</div>
          <button class="nav-arrow" id="next-category" aria-label="Next">?</button>
        </div>
      </div>

      <!-- Body Type selector (Step 1) -->
      <div id="body-selector" class="selection-section">
        <h2>Select Body Type</h2>
        <div class="option-grid">
          <button class="option-btn active" data-gender="male">
            <span class="icon">?</span>
            <span>Male</span>
          </button>
          <button class="option-btn" data-gender="female">
            <span class="icon">?</span>
            <span>Female</span>
          </button>
          <button class="option-btn" data-gender="teen">
            <span class="icon">??</span>
            <span>Teen</span>
          </button>
        </div>
        
        <!-- Customize button below body types -->
        <button class="next-btn" id="btn-customize">
          Customize Character ?
        </button>
      </div>

      <!-- Customization Section (Step 2) -->
      <div id="customize-section" class="selection-section hidden">
        <h2 id="section-title">Body</h2>
        
        <!-- Current category content -->
        <div id="category-content">
          <!-- Will be populated by JS based on current category -->
        </div>
      </div>
    </main>

    <!-- Bottom animation selector -->
    <footer class="animation-bar" id="animation-bar">
      <div class="animation-scroll">
        <button class="anim-btn active" data-animation="walk">
          <span class="icon">??</span>
          <span>Walk</span>
        </button>
        <button class="anim-btn" data-animation="run">
          <span class="icon">??</span>
          <span>Run</span>
        </button>
        <button class="anim-btn" data-animation="idle">
          <span class="icon">??</span>
          <span>Idle</span>
        </button>
        <button class="anim-btn" data-animation="slash">
          <span class="icon">?</span>
          <span>Slash</span>
        </button>
        <button class="anim-btn" data-animation="spellcast">
          <span class="icon">?</span>
          <span>Cast</span>
        </button>
        <button class="anim-btn" data-animation="shoot">
          <span class="icon">??</span>
          <span>Shoot</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- Scripts -->
  <script src="builder.js"></script>
</body>
</html>
