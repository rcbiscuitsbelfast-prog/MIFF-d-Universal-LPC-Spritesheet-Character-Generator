<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#667eea">
  <meta name="description" content="Create and customize LPC-style game characters with live animation preview">
  <title>LPC Character Builder v2</title>
  <link rel="stylesheet" href="builder.css">
  <style>
    /* Critical CSS for fast initial render */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 1.5rem;
      z-index: 9999;
    }
    
    #loading.hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- Loading screen -->
  <div id="loading">
    <div>
      <div class="spinner"></div>
      <p>Loading character builder...</p>
    </div>
  </div>

  <!-- Main app container -->
  <div id="app" class="hidden">
    <!-- Top navigation bar -->
    <header class="top-nav">
      <h1>?? LPC Builder <span style="font-size: 0.6em; opacity: 0.8;">v2</span></h1>
      <div class="nav-actions">
        <button class="nav-btn" id="btn-export" aria-label="Export character">
          <span class="icon">??</span>
          <span class="label">Export</span>
        </button>
        <button class="nav-btn" id="btn-import" aria-label="Import character">
          <span class="icon">??</span>
          <span class="label">Import</span>
        </button>
        <button class="nav-btn" id="btn-help" aria-label="Help">
          <span class="icon">?</span>
          <span class="label">Help</span>
        </button>
      </div>
    </header>

    <!-- Main content area -->
    <main class="main-content">
      <!-- Character preview canvas -->
      <div class="preview-container">
        <canvas id="character-canvas" width="192" height="192"></canvas>
        <div class="preview-info">
          <span id="current-animation">Walk</span>
          <span id="current-direction">Down</span>
        </div>
      </div>

      <!-- Gender selector (Phase 1) -->
      <div class="gender-selector">
        <h2>Body Type</h2>
        <div class="option-grid">
          <button class="option-btn active" data-gender="male">
            <span class="icon">??</span>
            <span>Male</span>
          </button>
          <button class="option-btn" data-gender="female">
            <span class="icon">??</span>
            <span>Female</span>
          </button>
          <button class="option-btn" data-gender="child">
            <span class="icon">??</span>
            <span>Child</span>
          </button>
          <button class="option-btn" data-gender="teen">
            <span class="icon">?????</span>
            <span>Teen</span>
          </button>
        </div>
      </div>
    </main>

    <!-- Bottom animation selector -->
    <footer class="animation-bar">
      <div class="animation-scroll">
        <button class="anim-btn active" data-animation="walk">
          <span class="icon">??</span>
          <span>Walk</span>
        </button>
        <button class="anim-btn" data-animation="run">
          <span class="icon">??</span>
          <span>Run</span>
        </button>
        <button class="anim-btn" data-animation="idle">
          <span class="icon">??</span>
          <span>Idle</span>
        </button>
        <button class="anim-btn" data-animation="combat_idle">
          <span class="icon">???</span>
          <span>Combat</span>
        </button>
        <button class="anim-btn" data-animation="slash">
          <span class="icon">??</span>
          <span>Slash</span>
        </button>
        <button class="anim-btn" data-animation="halfslash">
          <span class="icon">???</span>
          <span>Half Slash</span>
        </button>
        <button class="anim-btn" data-animation="backslash">
          <span class="icon">??</span>
          <span>Back Slash</span>
        </button>
        <button class="anim-btn" data-animation="thrust">
          <span class="icon">???</span>
          <span>Thrust</span>
        </button>
        <button class="anim-btn" data-animation="spellcast">
          <span class="icon">?</span>
          <span>Cast</span>
        </button>
        <button class="anim-btn" data-animation="shoot">
          <span class="icon">??</span>
          <span>Shoot</span>
        </button>
        <button class="anim-btn" data-animation="hurt">
          <span class="icon">??</span>
          <span>Hurt</span>
        </button>
        <button class="anim-btn" data-animation="jump">
          <span class="icon">??</span>
          <span>Jump</span>
        </button>
        <button class="anim-btn" data-animation="sit">
          <span class="icon">??</span>
          <span>Sit</span>
        </button>
        <button class="anim-btn" data-animation="climb">
          <span class="icon">??</span>
          <span>Climb</span>
        </button>
        <button class="anim-btn" data-animation="emote">
          <span class="icon">??</span>
          <span>Emote</span>
        </button>
      </div>
    </footer>

    <!-- Floating action button for menu (future phases) -->
    <button class="fab" id="menu-fab" aria-label="Open menu">
      <span class="icon">?</span>
    </button>
  </div>

  <!-- Scripts -->
  <script src="builder.js"></script>
</body>
</html>
