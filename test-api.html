<!DOCTYPE html>
<html>
<head>
  <title>API Test</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    pre { background: #f5f5f5; padding: 10px; border-radius: 5px; }
    button { padding: 10px; margin: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>LPC Asset API Test</h1>
  
  <button onclick="testHair()">Test Hair API</button>
  <button onclick="testTorso()">Test Torso API</button>
  <button onclick="testLegs()">Test Legs API</button>
  
  <div id="results"></div>
  
  <script>
    async function testHair() {
      const results = document.getElementById('results');
      results.innerHTML = '<h2>Testing Hair API...</h2>';
      
      try {
        const res1 = await fetch('/api/assets?category=hair');
        const data1 = await res1.json();
        results.innerHTML += `<h3>GET /api/assets?category=hair</h3>`;
        results.innerHTML += `<p>Status: ${res1.status}</p>`;
        results.innerHTML += `<p>Items found: ${data1.items?.length || 0}</p>`;
        results.innerHTML += `<pre>${JSON.stringify(data1, null, 2)}</pre>`;
        
        const res2 = await fetch('/api/assets?category=hair&subcategory=long&animation=walk');
        const data2 = await res2.json();
        results.innerHTML += `<h3>GET /api/assets?category=hair&subcategory=long&animation=walk</h3>`;
        results.innerHTML += `<p>Status: ${res2.status}</p>`;
        results.innerHTML += `<p>Items found: ${data2.items?.length || 0}</p>`;
        results.innerHTML += `<pre>${JSON.stringify(data2, null, 2)}</pre>`;
      } catch (error) {
        results.innerHTML += `<p style="color: red;">Error: ${error.message}</p>`;
      }
    }
    
    async function testTorso() {
      const results = document.getElementById('results');
      results.innerHTML = '<h2>Testing Torso API...</h2>';

        results.innerHTML += `<pre>${JSON.stringify(data1, null, 2)}</pre>`;
        
        const res2 = await fetch('/api/assets?category=torso&subcategory=shirt&gender=male&animation=walk');
        const data2 = await res2.json();
        results.innerHTML += `<h3>GET /api/assets?category=torso&subcategory=shirt&gender=male&animation=walk</h3>`;
        results.innerHTML += `<p>Status: ${res2.status}</p>`;
        results.innerHTML += `<p>Items found: ${data2.items?.length || 0}</p>`;
        results.innerHTML += `<pre>${JSON.stringify(data2, null, 2)}</pre>`;
      } catch (error) {
        results.innerHTML += `<p style="color: red;">Error: ${error.message}</p>`;
      }
    }
    
    async function testLegs() {
      const results = document.getElementById('results');
      results.innerHTML = '<h2>Testing Legs API...</h2>';
      
      try {
        const res1 = await fetch('/api/assets?category=legs');

        results.innerHTML += `<pre>${JSON.stringify(data1, null, 2)}</pre>`;
        
        const res2 = await fetch('/api/assets?category=legs&subcategory=pants2&gender=male&animation=walk');
        const data2 = await res2.json();
        results.innerHTML += `<h3>GET /api/assets?category=legs&subcategory=pants2&gender=male&animation=walk</h3>`;
        results.innerHTML += `<p>Status: ${res2.status}</p>`;
        results.innerHTML += `<p>Items found: ${data2.items?.length || 0}</p>`;

      } catch (error) {
        results.innerHTML += `<p style="color: red;">Error: ${error.message}</p>`;
      }
    }
  </script>
</body>
</html>
