<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple LPC Test</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #1e293b;
      color: white;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    
    canvas {
      border: 2px solid #3b82f6;
      background: #0f172a;
      image-rendering: pixelated;
      width: 256px;
      height: 256px;
    }
    
    #status {
      padding: 10px 20px;
      background: #334155;
      border-radius: 8px;
      font-size: 14px;
    }
    
    .error {
      background: #dc2626 !important;
    }
    
    .success {
      background: #16a34a !important;
    }
  </style>
</head>
<body>
  <h1>Simple LPC Sprite Test</h1>
  <div id="status">Loading...</div>
  <canvas id="canvas" width="64" height="64"></canvas>
  
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    
    ctx.imageSmoothingEnabled = false;
    
    let currentFrame = 0;
    let bodySprite = null;
    
    function updateStatus(msg, isError = false) {
      status.textContent = msg;
      status.className = isError ? 'error' : 'success';
      console.log(msg);
    }
    
    async function loadSprite() {
      updateStatus('Loading sprite...');
      
      const img = new Image();
      
      return new Promise((resolve, reject) => {
        img.onload = () => {
          updateStatus(`? Sprite loaded! ${img.width}x${img.height}`);
          resolve(img);
        };
        
        img.onerror = () => {
          updateStatus('? Failed to load sprite', true);
          reject(new Error('Failed to load'));
        };
        
        // Try to load male body walk animation
        img.src = '/spritesheets/body/male/light/walk/light.png';
      });
    }
    
    function render() {
      if (!bodySprite) return;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw current frame from walk animation (row 0)
      const sx = currentFrame * 64;
      const sy = 0; // Row 0 = walk down
      
      ctx.drawImage(
        bodySprite,
        sx, sy,
        64, 64,
        0, 0,
        64, 64
      );
    }
    
    function animate() {
      currentFrame = (currentFrame + 1) % 9; // 9 frames in walk
      render();
      setTimeout(animate, 100); // 10 FPS
    }
    
    // Start
    loadSprite()
      .then(sprite => {
        bodySprite = sprite;
        updateStatus('? Playing animation!');
        animate();
      })
      .catch(err => {
        updateStatus('? Error: ' + err.message, true);
      });
  </script>
</body>
</html>
